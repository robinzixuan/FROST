data:
  train_files: magicslabnu/OpenR1-Math-220k-split@train
  val_files: magicslabnu/OpenR1-Math-220k-split@test
  prompt_key: problem
  answer_key: answer
  reasoning_sample_key: solution
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 512
  max_response_length: 1024
  rollout_batch_size: 16  # Further reduced to prevent OOM
  mini_rollout_batch_size: 8  # Add mini batch for memory efficiency
  val_batch_size: 16  # Further reduced to prevent OOM
  format_prompt: ./examples/format_prompt/math.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 8  # Further reduced from 16
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: /projects/pxxxx/reasoning/AlphaOne/eval/GARPO1/checkpoints/gptoss_softmax1/final
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora_rank: 0  # Disable LoRA for easyR1
      lora_alpha: 0  # Disable LoRA for easyR1
      target_modules: null  # Disable LoRA for easyR1
      is_peft: false
      # Enable quantization to reduce memory usage
      load_in_4bit: false  # Enable 4-bit quantization
      bnb_4bit_use_double_quant: true
      bnb_4bit_quant_type: "nf4"
    optim:
      lr: 2e-5
      weight_decay: 2.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false  # Disable CPU offload due to gradient accumulation conflict
      enable_rank0_init: true   # Enable rank 0 init
      dtype: bf16
      use_orig_params: true

    offload:
      offload_params: true   # Enable parameter offloading
      offload_optimizer: true  # Enable optimizer offloading

  rollout:
    n: 2  # Further reduced from 2
    temperature: 0.6
    top_p: 0.95
    limit_images: 0
    gpu_memory_utilization: 0.4  # Further reduced from 0.6
    enforce_eager: true  # Enable eager mode to save memory
    enable_chunked_prefill: true  # Enable chunked prefill to save memory
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false  # Disable CPU offload for consistency
      enable_rank0_init: true
    offload:
      offload_params: true  # Enable parameter offloading for ref model

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score

trainer:
  max_steps: 100
  project_name: easy_r1
  experiment_name: gptoss_softmax1_math_fixed
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 1  # Keep at 1 to avoid memory issues
  max_try_make_batch: 20
  val_freq: 5
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 5
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: true
